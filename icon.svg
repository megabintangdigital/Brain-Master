<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13072b"/>
      <stop offset="50%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0b1338"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="40%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7f00ff"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#brainGrad)" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Glowing outer circular aura -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#glowGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="256" cy="256" r="140" fill="url(#brainGrad)" opacity="0.08"/>

  <!-- Brain Hemisphere Left & Right Geometry -->
  <g filter="url(#glow)">
    <!-- Left Hemisphere -->
    <path d="M236 140 C190 140 140 170 140 230 C140 260 155 280 170 295 C150 310 144 340 160 365 C176 390 210 395 236 385 Z" 
          fill="none" stroke="url(#brainGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Hemisphere -->
    <path d="M276 140 C322 140 372 170 372 230 C372 260 357 280 342 295 C362 310 368 340 352 365 C336 390 302 395 276 385 Z" 
          fill="none" stroke="url(#brainGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Neural Circuit Convolutions Left -->
    <path d="M236 180 C200 185 180 215 195 245 C205 265 236 260 236 285 C236 310 195 315 195 345" 
          fill="none" stroke="#00f2fe" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Neural Circuit Convolutions Right -->
    <path d="M276 180 C312 185 332 215 317 245 C307 265 276 260 276 285 C276 310 317 315 317 345" 
          fill="none" stroke="#9d4edd" stroke-width="8" stroke-linecap="round"/>

    <!-- Center Synapse Bridge -->
    <line x1="220" y1="210" x2="292" y2="210" stroke="#ffffff" stroke-width="4" stroke-dasharray="4 4"/>
    <line x1="220" y1="260" x2="292" y2="260" stroke="#00f2fe" stroke-width="4" stroke-dasharray="4 4"/>
    <line x1="220" y1="310" x2="292" y2="310" stroke="#4facfe" stroke-width="4" stroke-dasharray="4 4"/>
  </g>

  <!-- Neural Nodes (Glowing Dots) -->
  <circle cx="236" cy="140" r="8" fill="#ffffff"/>
  <circle cx="276" cy="140" r="8" fill="#ffffff"/>
  <circle cx="140" cy="230" r="7" fill="#00f2fe"/>
  <circle cx="372" cy="230" r="7" fill="#00f2fe"/>
  <circle cx="160" cy="365" r="7" fill="#9d4edd"/>
  <circle cx="352" cy="365" r="7" fill="#9d4edd"/>
  <circle cx="256" cy="210" r="6" fill="#ffffff"/>
  <circle cx="256" cy="260" r="6" fill="#00f2fe"/>
  <circle cx="256" cy="310" r="6" fill="#9d4edd"/>
  
  <!-- Subtle sparkles -->
  <path d="M256 95 L260 110 L275 114 L260 118 L256 133 L252 118 L237 114 L252 110 Z" fill="#00f2fe"/>
  <path d="M390 170 L393 180 L403 183 L393 186 L390 196 L387 186 L377 183 L387 180 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M120 170 L123 180 L133 183 L123 186 L120 196 L117 186 L107 183 L117 180 Z" fill="#9d4edd" opacity="0.9"/>
</svg>
